map $http_cf_connecting_ip $assistant_limit_key {
  "" $binary_remote_addr;
  default $http_cf_connecting_ip;
}

limit_req_zone $assistant_limit_key zone=ignis_assistant:10m rate=30r/m;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  tcp_nopush on;
  open_file_cache max=1000 inactive=20s;
  open_file_cache_valid 30s;

  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  # Shared across nginx workers; the API also applies its own conservative limit.
  location /api/v1/assistant/ {
    limit_req zone=ignis_assistant burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 50s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://127.0.0.1:8000/health;
    proxy_set_header Host $host;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /nasa-content/ {
    alias /usr/share/nginx/html/nasa-content/;
    add_header Cache-Control "public, max-age=86400";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
